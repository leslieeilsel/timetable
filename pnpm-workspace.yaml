packages:
  - apps/agent
  - apps/web
  - apps/teacher
  - packages/*

allowBuilds:
  "@google/genai": false
  esbuild: false
  protobufjs: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.86.1"
  - "@earendil-works/pi-agent-core@0.86.1"
  - "@earendil-works/pi-ai@0.86.1"
  - "@earendil-works/pi-telemetry@0.86.1"

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
