name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24.19.0"
          cache: true
          run-install: true
      - run: vp run @timetable/web#check
      - run: vp run @timetable/web#test -- run
      - run: vp run @timetable/web#build

  api-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
      - run: composer --working-dir=apps/api install --no-interaction --prefer-dist
      - run: composer --working-dir=apps/api check-platform-reqs
      - run: composer --working-dir=apps/api check
      - run: composer --working-dir=apps/api test

  api-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: timetable_test
          MYSQL_USER: timetable
          MYSQL_PASSWORD: timetable-test
          MYSQL_ROOT_PASSWORD: root-test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:YLmSA32rbYAoZIraBoDIvl6ydQni7vCSzaKnfYpNsRk=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: timetable_test
      DB_USERNAME: timetable
      DB_PASSWORD: timetable-test
      CACHE_STORE: database
      SESSION_DRIVER: database
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_mysql
          coverage: none
      - run: composer --working-dir=apps/api install --no-interaction --prefer-dist
      - run: php apps/api/artisan migrate:fresh --force
      - run: composer --working-dir=apps/api test:mysql

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24.19.0"
          cache: true
          run-install: true
      - run: vp run contract:lint
      - run: vp run @timetable/api-client#generate
      - run: git diff --exit-code

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24.19.0"
          cache: true
          run-install: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_sqlite
          coverage: none
      - run: composer --working-dir=apps/api install --no-interaction --prefer-dist
      - run: vp exec playwright install --with-deps chromium
      - run: vp exec playwright test
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
