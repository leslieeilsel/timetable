components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: timetable_session
      description: 同源 Laravel Sanctum Session；非安全方法同时要求 XSRF-TOKEN/X-XSRF-TOKEN。
  parameters:
    SemesterPath:
      name: semester
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ConstraintPath:
      name: constraint
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PlacementPath:
      name: placement
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RunPath:
      name: run
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CandidatePath:
      name: candidate
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    GroupPath:
      name: group
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    VersionPath:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        enum: [20, 50, 100]
        default: 20
    Search:
      name: search
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
    ResourceStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [active, inactive] }
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
    Direction:
      name: direction
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 使用同一次可编辑资源读取响应或列表项携带的强 ETag；全局格式为 catalog-N，学期格式为 semester-ID-timetable-N-catalog-N，用户格式为 user-ID-SHA256。
      schema:
        type: string
        minLength: 3
  schemas:
    WritePayload:
      type: object
      additionalProperties: true
      description: 各操作的字段由对应业务端点校验；客户端生成的 paths 类型保留端点与并发头约束。
    TimetableSwapPayload:
      type: object
      additionalProperties: false
      required: [entry_id, target_entry_id, version_id]
      properties:
        entry_id: { type: integer, minimum: 1 }
        target_entry_id: { type: integer, minimum: 1 }
        version_id: { type: integer, minimum: 1 }
    CalendarExceptionType:
      type: string
      enum: [move, swap, teacher_change, room_change, cancel, makeup, activity]
    OperationalStatus:
      type: string
      enum: [draft, active, cancelled]
    CalendarExceptionWrite:
      type: object
      additionalProperties: false
      required: [effective_date, type, reason]
      properties:
        effective_date: { type: string, format: date }
        replacement_date: { type: [string, "null"], format: date }
        type: { $ref: "#/components/schemas/CalendarExceptionType" }
        original_entry_id: { type: [integer, "null"], minimum: 1 }
        related_entry_id: { type: [integer, "null"], minimum: 1 }
        replacement_assignment_id: { type: [integer, "null"], minimum: 1 }
        replacement_teacher_id: { type: [integer, "null"], minimum: 1 }
        replacement_room_id: { type: [integer, "null"], minimum: 1 }
        replacement_item_id: { type: [integer, "null"], minimum: 1 }
        title: { type: [string, "null"], maxLength: 120 }
        reason: { type: string, minLength: 2, maxLength: 1000 }
    TeacherLeaveWrite:
      type: object
      additionalProperties: false
      required: [teacher_id, starts_at, ends_at, type]
      properties:
        teacher_id: { type: integer, minimum: 1 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        type: { type: string, enum: [sick, personal, training, official, other] }
        reason: { type: [string, "null"], maxLength: 1000 }
        includes_non_course_items: { type: boolean, default: false }
    SubstitutionBatchWrite:
      type: object
      additionalProperties: false
      required: [substitutions]
      properties:
        substitutions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [entry_id, date, replacement_teacher_id]
            properties:
              entry_id: { type: integer, minimum: 1 }
              date: { type: string, format: date }
              replacement_teacher_id: { type: integer, minimum: 1 }
              reason: { type: [string, "null"], maxLength: 500 }
    TeachingGroupWrite:
      type: object
      additionalProperties: false
      required: [name, mode, school_class_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        mode: { type: string, enum: [combined, split, roaming] }
        status: { type: string, enum: [active, inactive] }
        school_class_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    TeachingAssignmentWrite:
      type: object
      additionalProperties: false
      required: [course_id, teacher_id, weekly_items, room_mode]
      oneOf:
        - required: [school_class_id]
        - required: [teaching_group_id]
      properties:
        school_class_id: { type: [integer, "null"], minimum: 1 }
        teaching_group_id: { type: [integer, "null"], minimum: 1 }
        course_id: { type: integer, minimum: 1 }
        teacher_id: { type: integer, minimum: 1 }
        collaborator_ids:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        weekly_items: { type: integer, minimum: 1, maximum: 100 }
        items_per_session: { type: integer, minimum: 1, maximum: 10, default: 1 }
        week_pattern: { type: string, enum: [all, a, b, specified], default: all }
        active_weeks:
          type: [array, "null"]
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 60 }
        room_mode: { type: string, enum: [class_default, specified] }
        specified_room_id: { type: [integer, "null"], minimum: 1 }
        allows_substitution: { type: boolean, default: true }
    ScheduleRunRequest:
      type: object
      additionalProperties: false
      required: [scope, strategy, candidate_count]
      properties:
        scope:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [all, grade, class, assignment]
            ids:
              type: array
              maxItems: 500
              uniqueItems: true
              items: { type: integer, minimum: 1 }
        preservation:
          type: object
          additionalProperties: false
          properties:
            keep_locked: { type: boolean, default: true }
            keep_current: { type: boolean, default: false }
            base_version_id: { type: [integer, "null"], minimum: 1 }
        strategy:
          type: object
          additionalProperties: false
          required: [profile]
          properties:
            profile:
              type: string
              enum: [balanced, class_distribution, teacher_experience, room_utilization, custom]
            weights:
              type: object
              additionalProperties:
                type: integer
                minimum: 0
                maximum: 100
        candidate_count:
          type: integer
          enum: [1, 3]
    CandidateAdoptRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"], maxLength: 120 }
        activate: { type: boolean, default: false }
        reason: { type: [string, "null"], minLength: 2, maxLength: 500 }
    VersionReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        name: { type: [string, "null"], maxLength: 120 }
        reason: { type: string, minLength: 2, maxLength: 500 }
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [message, code, request_id]
      properties:
        message: { type: string }
        code: { type: string }
        request_id: { type: string }
      additionalProperties: true
  responses:
    Success:
      description: 成功
      headers:
        ETag:
          description: 当前聚合版本；可编辑读取必须在后续写入中原样作为 If-Match。
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Created:
      description: 已创建
      headers:
        ETag:
          description: 创建后的当前聚合版本。
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Accepted:
      description: 任务已创建并进入后台处理队列
      headers:
        ETag:
          description: 创建任务时对应的当前聚合版本。
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Problem:
      description: 结构化业务或验证错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
