openapi: 3.1.0
info:
  title: 单校区教务排课系统 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Laravel 模块化单体的权威 HTTP 契约。写入全局资料或学期数据时，
    必须使用最近一次对应读取响应返回的强 ETag 作为 If-Match。
servers:
  - url: /
security:
  - sanctumSession: []
tags:
  - name: 认证
    description: 登录、登出、密码修改与当前用户。
  - name: 用户
    description: 管理员维护本地账号和角色。
  - name: 系统
    description: 当前学期、学校时区和全局版本。
  - name: 学年学期
    description: 学年、学期与生命周期。
  - name: 基础资料
    description: 年级、班级、教师、课程和教室。
  - name: 学期班级
    description: 学期参与班级、固定教室和迁移。
  - name: 作息
    description: 星期和课程课节模板。
  - name: 教学任务
    description: 教学任务、状态与教室迁移。
  - name: 课表
    description: 手工排课、冲突、锁定、校验与导出。
  - name: 运维
    description: 进程和数据库就绪状态。
x-role-permission-matrix:
  unauthenticated:
    - GET /api/v1/health
    - POST /api/v1/auth/login
  viewer:
    description: 只读查看当前上下文及课表，并按班级、教师或教室导出 CSV；不能执行任何业务写入。
    operations: [authenticated reads, POST /api/v1/auth/logout, POST /api/v1/auth/change-password]
  scheduler:
    description: 包含查看者权限，并可维护学年学期、基础资料、班级配置、作息、教学任务与课表。
    exclusions:
      [
        user administration,
        school timezone,
        draft deletion,
        historical reopen,
        historical identity correction,
      ]
  admin:
    description: 包含排课员权限，并可管理用户和系统设置、清理空草稿、重开历史数据及执行受审计纠错。
  conditional:
    - operation: PATCH resource identity
      rule: 已有关闭学期引用时仅 admin 可更正名称或班级身份；停用仍按普通写权限处理。
