components:
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: timetable_session
      description: 同源 Laravel Sanctum Session；非安全方法同时要求 XSRF-TOKEN/X-XSRF-TOKEN。
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 使用同一次可编辑资源读取响应携带的强 ETag；全局格式为 catalog-N，学期格式为 semester-ID-timetable-N-catalog-N。
      schema:
        type: string
        minLength: 3
  schemas:
    WritePayload:
      type: object
      additionalProperties: true
      description: 各操作的字段由对应业务端点校验；客户端生成的 paths 类型保留端点与并发头约束。
    Envelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [message, code, request_id]
      properties:
        message: { type: string }
        code: { type: string }
        request_id: { type: string }
      additionalProperties: true
  responses:
    Success:
      description: 成功
      headers:
        ETag:
          description: 当前聚合版本；可编辑读取必须在后续写入中原样作为 If-Match。
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Created:
      description: 已创建
      headers:
        ETag:
          description: 创建后的当前聚合版本。
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Problem:
      description: 结构化业务或验证错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
